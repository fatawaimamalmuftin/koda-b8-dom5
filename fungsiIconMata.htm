<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiden PassWord</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .kolom-password {
            height: 30px;
            max-width: 400px;
        }

        form {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 90px;
            padding: 25px;
        }

        ul {
            padding: 5px 15px;
        }

        li {
            list-style: none;
        }

        .logo-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: 26px;
            font-weight: bold;
        }

        .pilih-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: 26px;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: black;
            cursor: pointer;
        }


        @media(max-width:768px) {
            .menu-toggle {
                display: block;
            }

            .pilih-nav {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 90px;
                right: 0;
                width: 100%;
                background-color: #f0f0f0;
                padding: 20px;
                gap: 15px;
            }

            .pilih-nav.active {
                display: flex;
            }
        }
    </style>
</head>

<body>

    <nav>

        <h1 class="logo-nav" style="height: auto;width: auto;">Ini Logo</h1>

        <button type="button" id="menu-toggle" class="menu-toggle">
            <i id="menu-icon" data-lucide="menu"></i>
        </button>

        <ul id="nav-Link" class="pilih-nav" style="height: auto;width: auto;">
            <li>about</li>
            <li>Home</li>
            <li>Contact</li>
        </ul>
    </nav>

    <form action="">
        <input type="password" id="kolom-password" placeholder="masukan PassWord" class="kolom-password">

        <button type="button" id="btn-toggle">
            <i id="my-icon" data-lucide="eye-closed"></i>
        </button>
    </form>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>


    <script>
        // logika hamburger Nav

        const menuToggle = document.getElementById("menu-toggle");
        const navLink = document.getElementById("nav-Link");
        const menuIcon = document.getElementById("menu-icon")

        menuToggle.addEventListener(("click"), () => {
            navLink.classList.toggle("active")
            // console.log("click")

            if (navLink.classList.contains("active")) {
                menuIcon.setAttribute("data-lucide", "X")
            } else {
                menuIcon.setAttribute("data-lucide", "menu")
            }
            lucide.createIcons();
        })

        // logika hiden password
        const inputPass = document.getElementById("kolom-password");
        const btn = document.getElementById("btn-toggle")
        const icon = document.getElementById("my-icon")

        btn.addEventListener("click", () => {
            const statusIcon = icon.getAttribute("data-lucide");

            if (statusIcon === "eye-closed") {
                icon.setAttribute("data-lucide", "eye")
                inputPass.type = "text";
            } else {
                icon.setAttribute("data-lucide", "eye-closed")
                inputPass.type = "password";
            }

            lucide.createIcons();
        })

    </script>

</body>

</html>
